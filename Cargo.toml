[package]
name = "kiro-lang"
version = "0.1.0"
edition = "2024"
default-run = "kr"

[lib]
name = "kiro"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "kr"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
glob = "0.3.4"
rand = "0.10.4"
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["gzip", "rustls-tls-webpki-roots"] }
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tiny_http = "0.12"

[target.'cfg(target_os = "linux")'.dev-dependencies]
socket2 = "0.6"
